{{ $title := cond .IsHome "Dicezzle - Free Dice Merge Puzzle Online" .Title }}
{{ $description := .Description | default site.Params.description }}
{{ $image := site.Params.ogImage | absURL }}
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="{{ if .Params.game }}website{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ $image }}">
<meta property="og:site_name" content="Dicezzle">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ $image }}">
