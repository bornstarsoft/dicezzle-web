<section class="game-shell" aria-label="Dicezzle Classic game">
  <div class="game-panel">
    <div class="game-topbar" aria-label="Game controls">
      <div class="game-actions">
        <button type="button" data-game-sound aria-pressed="false">Sound off</button>
        <button type="button" data-game-restart>Restart</button>
      </div>
    </div>
    <div class="game-hud" aria-label="Game stats">
      <div><span>Score</span><strong data-score>0</strong></div>
      <div><span>Best</span><strong data-best-score>0</strong></div>
      <div><span>Turn</span><strong data-turns>1</strong></div>
      <div class="game-hud__card--stars">
        <span data-stars-label>Stars</span>
        <strong class="stars-hud" data-stars-hud aria-label="Stars created: 0">
          <span class="stars-hud__die" data-stars-icon aria-hidden="true">
            <span class="stars-hud__star"></span>
          </span>
          <span class="stars-hud__count" data-stars-count>×0</span>
        </strong>
        <small data-star-clears>Clears 0</small>
      </div>
    </div>
    <div id="dicezzle-game" class="dicezzle-game-canvas" role="application" aria-label="Dicezzle board and tray"></div>
    <p class="tutorial-hint" data-tutorial-hint>
      Tap die, then board. Match 3 to merge.
      <button type="button" data-tutorial-dismiss>Got it</button>
    </p>
  </div>
  <div class="game-toast" data-game-toast hidden></div>
  <section class="result-panel" data-result-panel hidden aria-live="polite" aria-label="Game result">
    <div class="result-panel__inner">
      <div data-result-card></div>
      <div class="result-panel__actions">
        <button type="button" data-result-restart>Play Again</button>
        <button type="button" data-result-share>Share Result</button>
        <button type="button" data-result-copy>Copy Result</button>
      </div>
    </div>
  </section>
</section>
